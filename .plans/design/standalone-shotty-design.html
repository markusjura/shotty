:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {

* {

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

  overflow-x: auto;

  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)

  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)

  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {

  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  margin-block: 6px;
  border: 0;
  background: var(--border);
}

  align-items: center;

  border: 0;

.progress-bar:only-child {

  border: 0;

.tabular-nums {

}

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

  gap: 2px 12px;

.btn,
.nav-link,
.form-check-input,
.form-control,

.form-select {
  font: inherit;
}

.btn,

  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;

  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(

    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {

    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;

  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    (event) =&gt; {

        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||

&lt;details class=&quot;sd-limits&quot; id=&quot;sd-limits&quot;&gt;
  &lt;summary&gt;Prototype limits: what is real here and what is simulated&lt;/summary&gt;
  &lt;ul&gt;
    &lt;li&gt;Real: the editor draws on an HTML canvas over a synthetic sample image rendered at 2x. Drag creation for rectangle, ellipse, line, arrow, redact, spotlight and crop (any direction, 4 px threshold, Shift for square, circle or 45° lines), live preview, the tool stays active after drawing.&lt;/li&gt;
    &lt;li&gt;Real: Select (V) picks the nearest outline, drags to move (Shift locks an axis), resizes with the blue handles or line endpoints, arrow keys nudge (Shift 10 px), Backspace deletes. Escape cancels a drag; ⌘Z and ⇧⌘Z or ⌘Y undo and redo one gesture at a time.&lt;/li&gt;
    &lt;li&gt;Real: counters number sequentially; text is typed inline where you click in a multiline field (Return adds a line; ⌘Return, Escape or clicking outside finishes and keeps text; tool letters are not intercepted while typing); zoom (⌘+ ⌘- ⌘0 ⌘1) keeps pointer coordinates correct; crop applies with Enter and is undoable.&lt;/li&gt;
    &lt;li&gt;Real: Done stores the editable state per capture card and returns to the desktop; reopening a card restores its annotations and crop, and Done recreates a card that was closed while editing. Every mock capture shares one synthetic source image. Thumbnail miniatures still show that source; they do not render the edits.&lt;/li&gt;
    &lt;li&gt;Real: redaction reads the source pixels. Pixelate averages blocks and adds per-block noise; Blur uses a browser gaussian over padded source samples; Solid covers. Both effects only obscure visually and make no recoverability guarantee. Strength changes with the slider or [ and ].&lt;/li&gt;
    &lt;li&gt;Simulated: capture (area, window, fullscreen, scrolling, OCR), permissions, the menu bar item, settings persistence, shortcut registration, Copy and Save. Nothing is written to the clipboard or disk. Display choices are illustrative; real pointer-driven relocation across monitors is not demonstrated.&lt;/li&gt;
    &lt;li&gt;Settings show a flat layout with browser-native checkboxes, radio buttons, and menus. The macOS app uses SwiftUI Settings, a native sidebar and Form, system colors, SF Symbols, and system dialogs. Browser controls, titlebar, materials, focus rings, and typography are approximations, not custom-control requirements for the app.&lt;/li&gt;
    &lt;li&gt;Scrolling: Start → scroll manually or click Auto Scroll → Done is interactive. Manual scrolling hides Auto Scroll for this capture; a new capture restores it. Stopping automation on manual input is a Shotty proposal. The region handles are illustrative, the miniature repeats synthetic content, and no screen stitching or reliable end detection runs here.&lt;/li&gt;
    &lt;li&gt;Missing: real ScreenCaptureKit capture, window and scrolling stitching algorithms (the product includes horizontal scrolling; the preview only simulates vertical), OCR, native text input and IME, the native window minimum width (720 pt; below it this preview switches to overflow menus), SF Symbols (Lucide icons stand in), curved arrows, full tool-style choices, Option-center drawing, multi-selection and marquee, duplicate and copy or paste of objects, and pinch or Space-drag panning.&lt;/li&gt;
  &lt;/ul&gt;
&lt;/details&gt;
